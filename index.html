<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
            text-align: center;
        }

        header {
            background: #111827;
            color: white;
            padding: 50px 20px;
        }

        header h1 {
            font-size: 40px;
            margin: 0;
        }

        header p {
            font-size: 18px;
            margin-top: 10px;
        }

        .container {
            padding: 40px 20px;
        }

        .card {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background: #111827;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website 🚀</h1>
        <p>Created by Vinay</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Hello! 👋</h2>
            <p>
                Welcome to my first website.
                I'm learning website development and programming.
            </p>

            <a href="#" class="button">Explore</a>
        </div>
    </div>

    <footer>
        © 2026 My Website | Created by Vinay
    </footer>

</body>
</html>
